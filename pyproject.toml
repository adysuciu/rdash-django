[project]
name = "rdash-django"
version = "0.1.0"
description = "A modern Django 6 rebuild of the rdash dashboard demo."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django>=6.0,<6.1",
    "django-environ>=0.12,<0.13",
    "gunicorn>=23.0,<24.0",
    "httpx>=0.28,<0.29",
    "whitenoise>=6.11,<7.0",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-django>=4.11,<5.0",
    "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.setuptools.packages.find]
include = ["config*", "dashboard*", "sensors*"]

[tool.setuptools.package-data]
dashboard = ["templates/**/*.html", "static/**/*"]
sensors = ["templates/**/*.html", "static/**/*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
